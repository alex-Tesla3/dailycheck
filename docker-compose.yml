services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      DATABASE_URL: ${DATABASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_FREE_LIMIT: ${AI_FREE_LIMIT:-5}
    volumes:
      - habits_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  habits_data:
  caddy_data:
  caddy_config:
