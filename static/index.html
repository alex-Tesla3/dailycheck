<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f8cff">
<title>每日打卡</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-inner">
      <h1 id="page-title">每日打卡</h1>
      <div id="header-sub" class="header-sub"></div>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav" class="hidden">
    <button data-view="today" class="nav-item active"><span class="nav-icon">✓</span><span>今日</span></button>
    <button data-view="calendar" class="nav-item"><span class="nav-icon">📅</span><span>日历</span></button>
    <button data-view="bp" class="nav-item"><span class="nav-icon">❤</span><span>健康</span></button>
    <button data-view="analysis" class="nav-item"><span class="nav-icon">🤖</span><span>分析</span></button>
    <button data-view="habits" class="nav-item"><span class="nav-icon">✦</span><span>习惯</span></button>
    <button data-view="settings" class="nav-item"><span class="nav-icon">☰</span><span>我的</span></button>
  </nav>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
