# Render Blueprint 部署配置（Docker 方式）——免费版
# ⚠️ 免费限制：实例 15 分钟无流量会休眠（定时提醒暂停）；无持久磁盘（/data 为容器
# 临时目录，重新部署后数据会丢失）；750 免费实例小时/月由工作区所有免费服务共享。
# 正式使用请：plan 改回 starter，并取消下面 disk 块的注释（见 README）。
services:
  - type: web
    name: dailycreate
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        sync: false          # 首次部署时在 Render 控制台手动填写（用 openssl rand -hex 32 生成）
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: TZ
        value: Asia/Shanghai
    # 正式版（Starter 及以上）启用持久磁盘：
    # disk:
    #   name: habits-data
    #   mountPath: /data
    #   sizeGB: 1
